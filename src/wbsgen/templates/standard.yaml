# ======================================================================
# WBS 定義ファイル (標準工程テンプレート)
#   wbsgen build wbs.yaml   で Excel を生成します。
# ======================================================================
project:
  title: システム開発 スケジュール
  # updated_at: 2026-04-01 09:00   # 未指定なら生成時刻

chart:
  start: 2026-04-01        # チャート表示開始日 (未指定ならタスクから自動)
  period_days: 300         # 表示期間 (暦日)
  unit: week               # day / week / month
  base_date: 2026-04-01    # 現在日。状態と遅れの判定基準 (未指定なら実行日)
  man_month_days: 20
  thresholds:
    exec_remain_days: 5    # 「残り n 日」に切り替わる残稼働日数
    start_near_days: 10    # 「あと n 日」に切り替わる着手前稼働日数
  show:
    results: true          # 実績バー
    progress: false        # 予定バー内の進捗塗り
    manpower: true         # 工数列
    status: true           # 状態列
    start_date: true
    end_date: true
    predecessor: true
    predecessor_line: true # 先行タスク線
    now_line: true         # 現在日線
    inazuma_line: true     # イナズマ線
    member_color: true

calendar:
  workdays: [mon, tue, wed, thu, fri]
  japanese_holidays: true  # 日本の祝日を自動で休日にする
  holidays: []             # 追加の休業日
  extra_workdays: []       # 休日だが稼働する日

members:
  - { name: PM,    color: "#4472C4" }
  - { name: SE,    color: "#ED7D31" }
  - { name: PG,    color: "#70AD47" }
  - { name: テスト, color: "#FFC000" }

# ----------------------------------------------------------------------
# タスク
#   start を省略し predecessor を書くと、先行タスクの翌稼働日から自動配置。
#   days は稼働日数。終了日は稼働日カレンダーから算出されます。
#   kind: summary (工程バー) / milestone (記号) / task (既定)
# ----------------------------------------------------------------------
