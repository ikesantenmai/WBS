<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wbsgen — WBS / ガントチャート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5d9e'/%3E%3Crect x='3' y='4' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='5' y='7' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='4' y='10' width='6' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>WBS ジェネレータ</h1>
  <input id="title" class="title-input" type="text" aria-label="プロジェクト名" placeholder="プロジェクト名">
  <div class="spacer"></div>
  <div class="actions">
    <label class="btn ghost" for="import-file">読み込み
      <input id="import-file" type="file" accept=".yaml,.yml,.json,.csv,.tsv" hidden>
    </label>
    <button id="btn-template" class="btn ghost" type="button">雛形</button>
    <button id="btn-yaml" class="btn ghost" type="button">YAML 保存</button>
    <button id="btn-build" class="btn primary" type="button">Excel を生成</button>
  </div>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main class="layout">
  <!-- ============ 設定 ============ -->
  <aside class="panel settings" aria-label="設定">
    <section>
      <h2>チャート</h2>
      <label>表示開始日 <input id="chart-start" type="date"></label>
      <label>表示期間（日） <input id="chart-period" type="number" min="7" max="3650" step="1"></label>
      <label>表示単位
        <select id="chart-unit">
          <option value="day">日単位</option>
          <option value="week">週単位</option>
          <option value="month">月単位</option>
        </select>
      </label>
      <label>基準日（現在日） <input id="chart-base" type="date"></label>
    </section>

    <section>
      <h2>状態しきい値</h2>
      <label>「残り n 日」 <input id="th-remain" type="number" min="0" max="99"></label>
      <label>「あと n 日」 <input id="th-near" type="number" min="0" max="99"></label>
    </section>

    <section>
      <h2>表示</h2>
      <div id="show-flags" class="flags"></div>
    </section>

    <section>
      <h2>稼働日</h2>
      <div id="workdays" class="weekdays"></div>
      <label class="check"><input id="jp-holidays" type="checkbox"> 日本の祝日を休みにする</label>
      <label>追加の休業日
        <input id="extra-holidays" type="text" placeholder="2026-12-30, 2026-12-31">
      </label>
      <label>休日だが稼働する日
        <input id="extra-workdays" type="text" placeholder="2026-05-02">
      </label>
    </section>

    <section>
      <h2>担当者</h2>
      <div id="members" class="members"></div>
      <button id="btn-add-member" class="btn tiny" type="button">＋ 担当者</button>
    </section>

    <section id="summary-box">
      <h2>サマリ</h2>
      <dl id="summary" class="summary"></dl>
    </section>
  </aside>

  <!-- ============ 表 + チャート ============ -->
  <section class="panel workspace">
    <div class="toolbar">
      <button id="btn-add-task" class="btn tiny" type="button">＋ 行を追加</button>
      <button id="btn-add-summary" class="btn tiny" type="button">＋ 工程</button>
      <button id="btn-add-milestone" class="btn tiny" type="button">＋ マイルストーン</button>
      <span class="hint">行をクリックで編集／ドラッグで並べ替え</span>
      <div class="spacer"></div>
      <button id="btn-collapse" class="btn tiny" type="button" aria-pressed="false">表を畳む</button>
      <button id="btn-settings" class="btn tiny" type="button" aria-pressed="true">設定</button>
      <span id="status-chip" class="chip"></span>
    </div>

    <div id="scroller" class="scroller">
      <div class="grid">
        <div id="table-wrap" class="table-wrap"></div>
        <div id="chart-wrap" class="chart-wrap"></div>
      </div>
    </div>
  </section>
</main>

<!-- ============ 行編集ダイアログ ============ -->
<dialog id="task-dialog" class="dialog">
  <form method="dialog" id="task-form">
    <h2 id="task-dialog-title">タスクの編集</h2>
    <div class="form-grid">
      <label>大項目 <input name="group" type="text"></label>
      <label>中項目 <input name="subgroup" type="text"></label>
      <label>項番 <input name="no" type="text"></label>
      <label>種別
        <select name="kind">
          <option value="task">タスク</option>
          <option value="summary">工程（サマリ）</option>
          <option value="milestone">マイルストーン</option>
        </select>
      </label>
      <label class="wide">項目 <input name="name" type="text" required></label>

      <label>予定開始日 <input name="start" type="date"></label>
      <label>予定日数（稼働日） <input name="days" type="number" min="0" max="9999"></label>
      <label>実績開始日 <input name="actual_start" type="date"></label>
      <label>実績日数 <input name="actual_days" type="number" min="0" max="9999"></label>

      <label>進捗（%） <input name="progress" type="number" min="0" max="100" step="1"></label>
      <label>工数（人日） <input name="effort" type="number" min="0" step="0.5"></label>
      <label>先行（項番） <input name="predecessor" type="text" placeholder="11, 12"></label>
      <label>担当 <input name="member" type="text" list="member-list"></label>

      <label id="shape-field">記号
        <select name="shape">
          <option value="diamond">菱形</option>
          <option value="triangle">三角</option>
          <option value="circle">丸</option>
          <option value="star">星</option>
          <option value="arrow">矢印</option>
          <option value="chevron">山形</option>
        </select>
      </label>
      <label class="wide">コメント <input name="comment" type="text"></label>
    </div>
    <datalist id="member-list"></datalist>
    <p class="dialog-hint">
      予定開始日を空にして先行を書くと、先行タスクの翌稼働日から自動配置されます。
    </p>
    <menu class="dialog-actions">
      <button type="button" id="task-delete" class="btn danger">削除</button>
      <div class="spacer"></div>
      <button type="button" id="task-cancel" class="btn ghost">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </menu>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
