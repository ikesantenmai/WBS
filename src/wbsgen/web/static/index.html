<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空の WBS を作る</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5d9e'/%3E%3Crect x='3' y='4' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='5' y='7' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='4' y='10' width='6' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>空の WBS を作る</h1>
  <span class="tagline">期間を指定すると、日程表と記入用の空行だけの Excel を書き出します。</span>
  <div class="spacer"></div>
  <button id="btn-build" class="btn primary" type="button">Excel をダウンロード</button>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main class="layout">
  <!-- ============ 指定 ============ -->
  <form class="panel form" id="spec-form" autocomplete="off">
    <section>
      <h2>期間</h2>
      <label>プロジェクト名
        <input id="title" type="text" placeholder="2026年度 スケジュール">
      </label>
      <label>開始日 <input id="start" type="date" required></label>

      <div class="period-mode" role="radiogroup" aria-label="期間の指定方法">
        <label class="radio"><input type="radio" name="mode" value="end" checked> 終了日で指定</label>
        <label class="radio"><input type="radio" name="mode" value="months"> 月数で指定</label>
      </div>
      <label id="field-end">終了日 <input id="end" type="date"></label>
      <label id="field-months" hidden>月数 <input id="months" type="number" min="1" max="120" value="12"></label>
    </section>

    <section>
      <h2>用紙</h2>
      <label>日程表の単位
        <select id="unit"></select>
      </label>
      <label>記入用の空行
        <input id="rows" type="number" min="0" step="1">
      </label>
    </section>

    <section>
      <h2>稼働日</h2>
      <div id="workdays" class="weekdays"></div>
      <label class="check"><input id="jp-holidays" type="checkbox" checked> 日本の祝日を休みにする</label>
      <label>休業日を追加
        <input id="holidays" type="text" placeholder="2026-12-30, 2026-12-31">
      </label>
      <p class="note" id="holiday-note"></p>
    </section>

    <section>
      <h2>担当者一覧に載せる名前</h2>
      <label class="sr-only" for="members">担当者</label>
      <textarea id="members" rows="4" placeholder="設計&#10;製造&#10;テスト"></textarea>
      <p class="note">1 行に 1 人。空でもかまいません。</p>
    </section>
  </form>

  <!-- ============ プレビュー ============ -->
  <section class="panel preview">
    <div class="toolbar">
      <strong id="preview-title">プレビュー</strong>
      <span id="preview-info" class="chip"></span>
      <div class="spacer"></div>
      <span class="hint">実際の Excel と同じ列・同じ見出しです</span>
    </div>
    <div id="sheet" class="sheet" aria-live="polite"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
