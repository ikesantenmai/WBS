<!doctype html>
<html lang="ja" id="root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WBS ジェネレータ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f5d9e'/%3E%3Crect x='3' y='4' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='5' y='7' width='8' height='2' rx='1' fill='white'/%3E%3Crect x='4' y='10' width='6' height='2' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1 data-i18n="app_title">WBS ジェネレータ</h1>
  <span class="tagline" id="tagline"></span>
  <div class="spacer"></div>
  <select id="language" class="lang-select" aria-label="Language"></select>
  <label class="btn" for="import-file"><span data-i18n="import"></span>
    <input id="import-file" type="file" accept=".xlsx,.xlsm" hidden>
  </label>
  <button id="btn-back" class="btn" type="button" data-i18n="back" hidden></button>
  <button id="btn-export" class="btn primary" type="button" data-i18n="export" hidden></button>
  <button id="btn-build" class="btn primary" type="button" data-i18n="download"></button>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main class="layout">
  <!-- ============ 指定 ============ -->
  <form class="panel form" id="spec-form" autocomplete="off">
    <section id="period-section">
      <h2 data-i18n="section_period"></h2>
      <label><span data-i18n="field_title"></span>
        <input id="title" type="text">
      </label>
      <label><span data-i18n="field_start"></span> <input id="start" type="date" required></label>

      <div class="period-mode" role="radiogroup" aria-label="期間の指定方法">
        <label class="radio"><input type="radio" name="mode" value="end" checked> <span data-i18n="mode_end"></span></label>
        <label class="radio"><input type="radio" name="mode" value="months"> <span data-i18n="mode_months"></span></label>
      </div>
      <label id="field-end"><span data-i18n="field_end"></span> <input id="end" type="date"></label>
      <label id="field-months" hidden><span data-i18n="field_months"></span> <input id="months" type="number" min="1" max="120" value="12"></label>
    </section>

    <section id="paper-section">
      <h2 data-i18n="section_sheet"></h2>
      <label><span data-i18n="field_unit"></span>
        <select id="unit"></select>
      </label>
      <label><span data-i18n="field_rows"></span>
        <input id="rows" type="number" min="0" step="1">
      </label>
    </section>

    <section id="calendar-section">
      <h2 data-i18n="section_calendar"></h2>
      <div id="workdays" class="weekdays"></div>
      <label class="check"><input id="jp-holidays" type="checkbox" checked> <span data-i18n="field_jp_holidays"></span></label>
      <label><span data-i18n="field_holidays"></span>
        <input id="holidays" type="text" placeholder="2026-12-30, 2026-12-31">
      </label>
      <p class="note" id="holiday-note"></p>
    </section>

    <section id="members-section">
      <h2 data-i18n="section_members"></h2>
      <label class="sr-only" for="members" data-i18n="field_members"></label>
      <textarea id="members" rows="4"></textarea>
      <p class="note" data-i18n="members_note"></p>
    </section>
  </form>

  <!-- ============ プレビュー ============ -->
  <section class="panel preview">
    <div class="toolbar">
      <strong id="preview-title"></strong>
      <span id="preview-info" class="chip"></span>
      <div class="spacer"></div>
      <label id="chart-unit-field" class="inline-field" hidden><span data-i18n="chart_unit"></span>
        <select id="chart-unit"></select>
      </label>
      <span class="hint" id="preview-hint"></span>
    </div>
    <dl id="totals" class="totals" hidden></dl>
    <div id="sheet" class="sheet" aria-live="polite"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
