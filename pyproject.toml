[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbsgen"
version = "1.0.0"
description = "WBS / ガントチャート Excel 生成アプリケーション"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.scripts]
wbsgen = "wbsgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wbsgen = ["templates/*.yaml"]
